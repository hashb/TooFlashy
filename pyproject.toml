[project]
name = "tooflashy"
version = "0.1.0"
authors = [
    { name = "orb", email = "orb@orb.local" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
]

[dependency-groups]
dev = [
    "pillow>=10",
    "pytest>=8",
]

[project.scripts]
tooflashy = "tooflashy.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
